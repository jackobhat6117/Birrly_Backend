name: Backend CI

on:
  push:
    branches: [main, oat-env]
  pull_request:
    branches: [main, oat-env]
  workflow_dispatch:

# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_USER              — SSH username on the VPS (e.g. root, ubuntu, deploy)
#   DEPLOY_PASSWORD          — SSH password for the deploy user
#   DEPLOY_PATH              — Absolute path to this repo on the server (e.g. /opt/Birrly_Backend)
#   DEPLOY_PATH_OAT          — Optional separate clone for oat-env (e.g. /opt/Birrly_Backend_OAT)
# Optional:
#   DEPLOY_SSH_PORT          — SSH port (default 22)

env:
  DEPLOY_HOST: 169.58.251.68

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    concurrency:
      group: backend-deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy API stack over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            REPO="${{ secrets.DEPLOY_PATH }}"
            if [ -z "$REPO" ]; then
              echo "DEPLOY_PATH secret is not set"
              exit 1
            fi
            cd "$REPO"
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f

  deploy-oat:
    name: Deploy OAT stack to VPS
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/oat-env' && github.event_name != 'pull_request'
    environment: oat
    concurrency:
      group: backend-deploy-oat
      cancel-in-progress: false
    steps:
      - name: Deploy OAT API stack over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            REPO="${{ secrets.DEPLOY_PATH_OAT || secrets.DEPLOY_PATH }}"
            if [ -z "$REPO" ]; then
              echo "DEPLOY_PATH or DEPLOY_PATH_OAT secret is not set"
              exit 1
            fi
            cd "$REPO"
            git fetch origin oat-env
            git reset --hard origin/oat-env
            docker compose -f docker-compose.oat.yml up -d --build
            docker image prune -f
